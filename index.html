 <script>
// Auth functions - Supabase client ke baad add karo
async function register(){
  const {error} = await supa.auth.signUp({email: email.value, password: pass.value})
  msg.innerText = error ? error.message : 'Registered ✅ Ab Login karo'
}
async function login(){
  const {data,error} = await supa.auth.signInWithPassword({email: email.value, password: pass.value})
  msg.innerText = error ? error.message : 'Login Success ✅'
  if(!error) location.reload()
}
// Session check
supa.auth.getSession().then(({data})=>{
  if(data.session){ authBox.style.display='none'; document.getElementById('mainApp').style.display='block' }
})

create extension if not exists "uuid-ossp";

-- 1. profiles
create table profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  name text,
  phone text,
  email text,
  business_name text,
  business_type text,
  language text default 'en',
  created_at timestamp with time zone default now()
);
alter table profiles enable row level security;

-- 2. customers
create table customers (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references auth.users(id) on delete cascade not null,
  name text not null,
  phone text,
  address text,
  opening_balance numeric default 0,
  created_at timestamp with time zone default now()
);
alter table customers enable row level security;

-- 3. transactions
create table transactions (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references auth.users(id) on delete cascade not null,
  customer_id uuid references customers(id) on delete cascade,
  type text check (type in ('sale','payment','expense')),
  amount numeric not null,
  payment_status text default 'due',
  notes text,
  transaction_date timestamp with time zone default now()
);
alter table transactions enable row level security;

-- 4. products
create table products (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references auth.users(id) on delete cascade not null,
  name text not null,
  unit text,
  selling_price numeric,
  purchase_price numeric,
  stock numeric default 0,
  low_stock_limit numeric default 10,
  category text,
  created_at timestamp with time zone default now()
);
alter table products enable row level security;

-- 5. expenses
create table expenses (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references auth.users(id) on delete cascade not null,
  category text,
  amount numeric not null,
  description text,
  expense_date date default current_date,
  created_at timestamp with time zone default now()
);
alter table expenses enable row level security;

-- 6. orders (sales bills)
create table orders (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references auth.users(id) on delete cascade not null,
  customer_id uuid references customers(id),
  total_amount numeric not null,
  status text default 'Due',
  bill_no text,
  items jsonb,
  order_date timestamp with time zone default now()
);
alter table orders enable row level security;

-- 7. payments
create table payments (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references auth.users(id) on delete cascade not null,
  customer_id uuid references customers(id),
  amount numeric not null,
  payment_method text,
  payment_date timestamp with time zone default now()
);
alter table payments enable row level security;

-- 8. reminders
create table reminders (
  id uuid primary key default uuid_generate_v4(),
  user_id uuid references auth.users(id) on delete cascade not null,
  customer_id uuid references customers(id),
  amount numeric,
  due_date date,
  status text default 'pending',
  message_template text,
  created_at timestamp with time zone default now()
);
